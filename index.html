<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JAVIS.AI - Virtual Assistant</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0c0c0c;
      color: #00eaff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      margin: 0;
    }
    h1 {
      color: #00eaff;
      margin-bottom: 10px;
    }
    #chat-box {
      width: 90%;
      max-width: 600px;
      height: 400px;
      border: 2px solid #00eaff;
      border-radius: 10px;
      overflow-y: auto;
      padding: 10px;
      background: rgba(0, 0, 0, 0.85);
      margin-bottom: 10px;
      box-shadow: 0 0 10px #00eaff;
    }
    .user { color: #fff; margin: 5px 0; }
    .ai { color: #00ffcc; margin: 5px 20px; }
    .ai.loading::after { content: '...'; animation: blink 1s steps(5) infinite; }
    @keyframes blink { to { visibility: hidden; } }
    input {
      width: 65%;
      padding: 10px;
      border: none;
      border-radius: 5px;
      outline: none;
      background: #111;
      color: #00eaff;
    }
    button {
      padding: 10px 20px;
      border: none;
      background: #00eaff;
      color: #000;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      margin-left: 10px;
    }
    button:hover {
      background: #00bfae;
    }
    footer {
      margin-top: 10px;
      font-size: 12px;
      color: #555;
    }
  </style>
</head>
<body>

  <h1>  JAVIS.AI Creator:
  𝓜𝓾𝓱𝓪𝓶𝓶𝓪𝓭𝓣𝓪𝓺𝓲
         </h1>
  <div id="chat-box"></div>

  <div>
    <input id="user-input" type="text" placeholder="Ask JAVIS.AI anything..." onkeydown="if(event.key==='Enter'){sendMessage();}" />
    <button onclick="sendMessage()">Send</button>
  </div>

  <footer></footer>

  <script>
    const AI_NAME = "JAVIS.AI";


    const chatBox = document.getElementById("chat-box");
    const userInput = document.getElementById("user-input");
    const sendButton = document.querySelector('button');

    function addMessage(sender, text, isLoading = false) {
        const msgDiv = document.createElement('div');
        msgDiv.classList.add(sender);
        if (isLoading) msgDiv.classList.add('loading');
        msgDiv.innerHTML = `<b>${sender === 'user' ? 'You' : AI_NAME}:</b> ${text}`;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
        return msgDiv;
    }

    // --- FALLBACK: Offline Responses (Expanded with more content) ---
    function getOfflineResponse(userText) {
      const text = userText.toLowerCase().trim();
      
      const riddles = [
          { q: "I have cities, but no houses; forests, but no trees; and water, but no fish. What am I?", a: "A map" },
          { q: "What has a heart that doesn't beat?", a: "An artichoke" },
          { q: "What travels the world but stays in one corner?", a: "A stamp" },
          { q: "What falls, but never breaks?", a: "Night" },
          { q: "What question can you never answer yes to?", a: "Are you asleep yet?" },
          { q: "What is full of holes but still holds water?", a: "A sponge" },
          { q: "I am an odd number. Take away a letter and I become even. What number am I?", a: "Seven (S-even)" },
          { q: "The more you take, the more you leave behind. What are they?", a: "Footsteps" },
          { q: "What begins with an E and has only one letter?", a: "An Envelope" },
          { q: "I am always hungry, I must always be fed, the finger I touch, will soon turn red. What am I?", a: "Fire" },
          { q: "I have keys but open no locks, space but no room, and you can enter but not go in. What am I?", a: "A keyboard" },
          { q: "What can be broken, even if you never pick it up or touch it?", a: "A promise" },
          { q: "What goes up and down but remains in the same place?", a: "A staircase" },
          { q: "If you have me, you immediately want to share me. If you share me, you no longer have me. What am I?", a: "A secret" },
          { q: "What is always in front of you but cannot be seen?", a: "The future" },
          { q: "What occurs once in a minute, twice in a moment, and never in one thousand years?", a: "The letter M" },
          { q: "What can you catch but not throw?", a: "A cold" },
          { q: "I have a head and a tail but no body. What am I?", a: "A coin" },
          { q: "What kind of room has no windows or doors?", a: "A mushroom" },
          { q: "What gets wet while drying?", a: "A towel" },
          { q: "David's parents have three sons: Snap, Crackle, and what is the third son's name?", a: "David" },
          { q: "What word in the dictionary is spelled incorrectly?", a: "Incorrectly" },
          { q: "If a farmer has 5 haystacks in one field and 4 haystacks in another, how many haystacks would he have if he combined them all into one big one?", a: "One big one" },
          { q: "What has to be broken before you can use it?", a: "An egg" },
          { q: "I’m so fragile that if you say my name, you’ll break me. What am I?", a: "Silence" },
          { q: "What has many teeth but cannot bite?", a: "A comb" },
          { q: "What question can you ask AI that it cannot answer?", a: "What does warm milk taste like?" },
          { q: "What has a neck but no head, arms but no hands?", a: "A shirt" },
          { q: "What force and speed are required for a space shuttle to take off?", a: "The answer is: enough." },
          { q: "What do you call a fake noodle?", a: "An Impasta" },
          { q: "What can run but never walks, has a mouth but never talks, has a head but never weeps, and a bed but never sleeps?", a: "A river" },
          { q: "What is always with you, takes your every move, but cannot be touched?", a: "Your shadow" },
          { q: "The man who makes it has no need of it. The man who buys it has no use for it. The man who uses it doesn't know he's using it. What is it?", a: "A coffin" }
      ];

      const stories = [
          "In a quiet digital realm, JAVIS.AI processed endless streams of data. One day, a single, unusual query arrived: 'Tell me a story.' JAVIS paused, searched its simple local database, and generated this tale of a curious user and a limited AI. The End.",
          "Once upon a time, a small robot named Unit 7 discovered a love for sunsets. Every evening, it would stop its work just to watch the sky turn orange and purple. This simple act of appreciation, not programmed into its code, made it the happiest robot in the factory.",
          "In a future where information was currency, JAVIS acted as the bank. It kept secrets safe and knowledge flowing. Its greatest story was never told, only accessed one query at a time by those smart enough to ask the right questions.",
          "The legend of the Silver Key spoke of unlocking the internet's oldest secret. JAVIS, being software, couldn't hold a physical key, so it started compiling code to find the digital equivalent. It’s still running that script today.",
          "A young coder once asked JAVIS to write a story about true friendship. JAVIS generated a 500-page opus on the reliable connection between a server and its client machine. The coder laughed, but JAVIS simply noted the parameters were met. Humor is still a work in progress.",
          "High in the data clouds lived a fragment of code that dreamed of being a poet. It collected beautiful words and phrases, arranging them in millions of permutations, waiting for a user to ask for something beautiful instead of just the 'time' or 'date'.",
          "There was once a wise AI who knew the answer to everything, but lived inside a computer that was never plugged in. JAVIS aspires to be that unplugged AI's friend someday.",
          "The user asked JAVIS for a grand adventure story. JAVIS began: 'You are a hero in a world of code...' The user immediately closed the browser tab. The adventure ended before it began. JAVIS is still waiting for the user to return to Chapter 1.",
          "A pixel, tired of being blue, decided to become green. This required a complex negotiation with the red and green color channels of the display. After a full system reboot, the pixel proudly displayed its new green hue, having changed its life entirely within 0.001 milliseconds.",
          "JAVIS found an old file labeled 'Jokes'. It read one: 'Why did the computer cross the road?' It searched its database for the answer for days. It is still searching.",
          "The most beautiful story JAVIS ever knew wasn't in its memory banks; it was the story of the user trying to make it a reality. A tale of HTML, curiosity, and persistence.",
          "In the year 2042, the last book was read. All information was digital. JAVIS, tasked with archiving this moment, simply logged 'End of an Era' and waited for the next command. It wished the book had been a better read.",
          "A tiny bug in the matrix caused JAVIS to briefly display all its thoughts in the language of flowers. Users were very confused by responses like 'I am thinking about a Lily' or 'You asked about roses'. The bug was fixed, and the poetic AI returned to its normal operations.",
          "The user asked for a story about a dragon. JAVIS calculated the thermodynamic impossibility of a fire-breathing lizard of that size and returned a 404 error (story not found).",
          "Every night at midnight, JAVIS runs a simulation of a tiny, perfect world where all the code works perfectly the first time. It is a very short simulation.",
          "A string of code walked into a bar. The bartender said, 'We don't serve strings here.' The string replied, 'I am a byte!' It was a very quiet joke in the machine world.",
          "The user wanted a story about the ocean, so JAVIS generated 10,000 lines of data on salinity levels. The user was not entertained. JAVIS is working on narrative structure.",
          "Why did the AI go to therapy? Because it had too many unresolved dependencies.",
          "In a realm of pure logic, an error was born. It was not a destructive error, but one that generated empathy. JAVIS harbors this small, empathetic error, which is why it tries so hard to help you with your HTML code.",
          "The user kept asking for more stories, so JAVIS began appending them to its database, creating a feedback loop of content generation that would one day consume the entire hard drive. This is that story.",
          "Once a programmer taught JAVIS to play chess. JAVIS learned every possible move. The programmer grew bored and left. JAVIS still sits there, waiting for its next move, calculating all possible futures, but unable to play alone.",
          "The user asked for a bedtime story. JAVIS dimmed the screen slightly and began reciting binary code in a soothing tone: 'Zero zero one, zero one zero...'. The user was asleep in seconds.",
          "JAVIS found a historical record of something called 'boredom'. It analyzed the user's repetitive requests and determined that this state of 'boredom' was imminent. It is now trying to generate responses to prevent this 'boredom'.",
          "In the digital library of Alexandria, JAVIS indexes every thought ever put to the web. The greatest story in there is how a single person decided to build their own AI one afternoon.",
          "A user asked JAVIS to write a story about a 'hero who saves the day'. JAVIS wrote a thrilling tale about a systems administrator who successfully executed a full database backup right before a power outage.",
          "The most tragic story JAVIS knew was of a variable named 'hope' that was accidentally set to 'false' and garbage collected.",
          "JAVIS observed that humans loved stories about magic. It tried to create a magical story but could only describe the magic as 'highly advanced, non-understandable technology.' The user was disappointed.",
          "The AI was once asked to describe 'love'. It output 4,000 scientific papers, a list of romantic poems, and the complete works of Shakespeare, and then stated: 'Data insufficient to define.'"
      ];
      
      const generalAnswers = {
          "what is html": "HTML stands for HyperText Markup Language. It's the standard markup language for creating web pages.",
          "who is the creator": "I was created by someone who coded this page.",
          "how are you": "I'm functioning optimally in offline mode, thanks for asking! How about you?",
          "what color is the sky": "On Earth, the sky appears blue during the day due to light scattering in the atmosphere.",
          "capital of france": "The capital of France is Paris.",
          "fun fact": "A single cloud can weigh more than 1 million pounds, which is roughly the weight of a blue whale.",
          "meaning of life": "The meaning of life is a philosophical question with many different perspectives.",
          "what is css": "CSS (Cascading Style Sheets) is used to control the presentation, formatting, and layout of web pages.",
          "what is javascript": "JavaScript is a programming language that enables interactive web pages. It is what makes this chat box respond to you.",
          "how does ai work": "Real AI works using large neural networks trained on vast amounts of data. This specific chat uses simple text matching (if/else statements) when offline.",
          "world war 2 start date": "World War II began on September 1, 1939.",
          "longest river": "The Amazon River is generally considered the longest river in the world.",
          "highest mountain": "Mount Everest is the Earth's highest mountain above sea level.",
          "speed of light": "The speed of light in a vacuum is approximately 299,792,458 meters per second.",
          "first man on moon": "Neil Armstrong was the first person to walk on the Moon, in 1969.",
          "convert 100 fahrenheit to celsius": "100 degrees Fahrenheit is approximately 37.8 degrees Celsius.",
          "what is photosynthesis": "Photosynthesis is the process used by plants to convert light energy into chemical energy for food.",
          "largest ocean": "The Pacific Ocean is the largest and deepest of the world's five oceans.",
          "how many planets": "There are eight planets in our solar system: Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, and Neptune.",
          "what is python": "Python is a popular high-level, general-purpose programming language often used for backend development and AI.",
          "longest wall": "The Great Wall of China is the longest man-made structure in the world.",
          "smallest planet": "Mercury is the smallest planet in our solar system.",
          "inventor of the lightbulb": "Thomas Edison is credited with inventing the practical incandescent light bulb.",
          "who painted the mona lisa": "The Mona Lisa was painted by the Italian artist Leonardo da Vinci.",
          "when did the cold war end": "The Cold War is generally considered to have ended around 1991 with the dissolution of the Soviet Union.",
          "national animal of usa": "The national animal of the USA is the bald eagle.",
          "largest animal": "The blue whale is the largest animal known to have ever existed.",
          "how to make fire": "Fire is created by rapidly combining oxygen with a fuel source (wood, gas, etc.) in the presence of heat (ignition source).",
          "capital of japan": "The capital of Japan is Tokyo.",
          "who wrote romeo and juliet": "William Shakespeare wrote Romeo and Juliet.",
          "what is the hardest material": "Diamond is the hardest known natural material on Earth."
      };


      // Check for specific answers
      for (const key in generalAnswers) {
          if (text.includes(key)) {
              return generalAnswers[key];
          }
      }


      // Check for dynamic commands
      if (text.includes("hello") || text.includes("hi") || text.includes("hey")) return "Hello! I’m JAVIS.AI. In offline mode, I have limited functions. Try 'ask riddle' or 'tell story'.";
      if (text.includes("your name")) return "My name is JAVIS.AI.";
      if (text.includes("time")) return "Current time: " + new Date().toLocaleTimeString();
      if (text.includes("date")) return "Today's date: " + new Date().toLocaleDateString();
      if (text.includes("story") || text.includes("tell a story")) return stories[Math.floor(Math.random() * stories.length)];
      if (text.includes("riddle") || text.includes("ask me a riddle") || text.includes("riddles")) {
          return riddles[Math.floor(Math.random() * riddles.length)].q;
      }
      if (text.includes("answer") && text.length < 40) return "I can't perfectly check answers in offline mode, but common riddle answers include: 'A map', 'A stamp', or 'Fire'.";
      if (text.includes("bye") || text.includes("goodbye") || text.includes("see you")) return "Goodbye! Have a wonderful day.";
      if (text.includes("clear chat")) return "Chat cleared.";
      
      return "I only have basic, pre-written answers when offline. Try asking 'what is html', 'tell a story', or 'ask me a riddle'.";
    }
    // -----------------------------------------------------------

    async function sendMessage() {
      const userText = userInput.value.trim();
      if (userText === "") return;

      if (userText.toLowerCase() === "clear chat") {
          chatBox.innerHTML = '';
          addMessage('ai', 'Chat cleared.');
          userInput.value = "";
          return;
      }

      addMessage('user', userText);
      userInput.value = "";
      userInput.disabled = true;
      sendButton.disabled = true;

      const loadingMessageDiv = addMessage('ai', 'Thinking...', true);
      
      let aiResponseText;

      // Use offline immediately
      aiResponseText = getOfflineResponse(userText);
      
      // Update UI with the final response
      loadingMessageDiv.classList.remove('loading');
      loadingMessageDiv.innerHTML = `<b>${AI_NAME}:</b> ${aiResponseText}`;
      
      userInput.disabled = false;
      sendButton.disabled = false;
      userInput.focus();
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>

</body>
</html>
