<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JAVIS.AI - Virtual Assistant</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0c0c0c;
      color: #00eaff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      margin: 0;
    }
    h1 {
      color: #00eaff;
      margin-bottom: 10px;
      text-align: center;
    }
    #chat-box {
      width: 90%;
      max-width: 600px;
      height: 400px;
      border: 2px solid #00eaff;
      border-radius: 10px;
      overflow-y: auto;
      padding: 10px;
      background: rgba(0, 0, 0, 0.85);
      margin-bottom: 10px;
      box-shadow: 0 0 10px #00eaff;
    }
    .user { color: #fff; margin: 5px 0; }
    .ai { color: #00ffcc; margin: 5px 20px; }
    input {
      width: 65%;
      padding: 10px;
      border: none;
      border-radius: 5px;
      outline: none;
      background: #111;
      color: #00eaff;
    }
    button {
      padding: 10px 20px;
      border: none;
      background: #00eaff;
      color: #000;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      margin-left: 10px;
    }
    button:hover { background: #00bfae; }
    footer { margin-top: 10px; font-size: 12px; color: #555; }
  </style>
</head>
<body>

<h1>JAVIS.AI<br>Creator: ꧁༒𝓜𝓾𝓱𝓪𝓶𝓶𝓪𝓭𝓣𝓪𝓺𝓲༒꧂</h1>
<div id="chat-box"></div>

<div>
  <input id="user-input" type="text" placeholder="Ask JAVIS.AI anything..." onkeydown="if(event.key==='Enter'){sendMessage();}" />
  <button onclick="sendMessage()">Send</button>
</div>

<footer>© 2025 JAVIS.AI</footer>

<script>
const AI_NAME = "JAVIS.AI";
const AI_CREATOR = "꧁༒𝓜𝓾𝓱𝓪𝓶𝓶𝓪𝓭𝓣𝓪𝓺𝓲༒꧂";

// ================== STORIES ==================
const stories = {
  "The Lost Treasure": "Once upon a time in a distant land, a young explorer discovered a hidden map. He faced storms, wild animals, and tricky puzzles, but his courage led him to the lost treasure hidden beneath a waterfall. He returned home a hero and shared his wealth with his village.",
  "The Brave Little Fox": "In the deep forest, a small fox showed immense courage when it saved its friends from a hunter. Though small, the fox's clever thinking and quick action inspired the other animals to be brave in the face of danger.",
  "The Magic Paintbrush": "A poor artist found a magic paintbrush that brought anything he painted to life. He painted food for the hungry and houses for the poor. His kindness spread joy, and he learned that the real magic was in helping others.",
  "The Talking Tree": "An ancient tree could speak and offered wisdom to those who visited it. A lost traveler sought guidance from the tree and learned lessons of patience, friendship, and respect for nature. He carried these lessons for the rest of his life.",
  "The Cloud Kingdom": "High above the mountains was a kingdom in the clouds. A young prince ventured there to learn the secrets of the wind. He discovered the kingdom's beauty, befriended cloud creatures, and returned home wiser and more compassionate.",
  "The Invisible Friend": "A lonely girl discovered an invisible friend who taught her the joy of imagination. Together they went on adventures, solved problems, and learned that true friendship transcends what can be seen.",
  "The Rainbow Bridge": "A bridge appeared after a storm, leading to a magical land of colors. Children who crossed it learned courage and kindness, and the land taught them that every action can create beauty in the world.",
  "The Clever Rabbit": "A clever rabbit outwitted a hungry wolf using tricks and disguises. The forest animals celebrated his courage, showing that intelligence and creativity are as powerful as strength.",
  "The Star Catcher": "A boy who loved stars built a ladder to reach the night sky. He caught a falling star and returned it to the heavens, teaching him that dreams are worth chasing even when they seem impossible.",
  "The Whispering River": "A river whispered secrets of the forest to anyone who listened. A young girl followed its whispers and discovered hidden paths, treasures, and the value of listening carefully to nature."
  // Add more stories up to 100+
};

// ================== RIDDLES ==================
const riddles = [
  { question: "I speak without a mouth and hear without ears. What am I?", answer: "An echo." },
  { question: "What has keys but can't open locks?", answer: "A piano." },
  { question: "I’m tall when I’m young, and I’m short when I’m old. What am I?", answer: "A candle." },
  { question: "What has a heart that doesn’t beat?", answer: "An artichoke." },
  { question: "What comes once in a minute, twice in a moment, but never in a thousand years?", answer: "The letter M." },
  { question: "What can travel around the world while staying in a corner?", answer: "A stamp." },
  { question: "I have cities but no houses, forests but no trees, and water but no fish. What am I?", answer: "A map." },
  { question: "The more you take, the more you leave behind. What am I?", answer: "Footsteps." },
  { question: "I’m always hungry and will die if not fed, but whatever I touch will soon turn red. What am I?", answer: "Fire." },
  { question: "What has hands but can’t clap?", answer: "A clock." }
  // Add more riddles up to 100+
];

function getRandomRiddle() {
  const r = riddles[Math.floor(Math.random() * riddles.length)];
  return `Riddle: ${r.question}\nAnswer: ${r.answer}`;
}

// ================== JOKES ==================
const jokes = [
  "Why don't scientists trust atoms? Because they make up everything!",
  "Why did the bicycle fall over? Because it was two-tired!",
  "Why did the scarecrow win an award? Because he was outstanding in his field!",
  "Why did the math book look sad? Because it had too many problems!",
  "Why did the tomato turn red? Because it saw the salad dressing!",
  "Why don’t skeletons fight each other? They don’t have the guts!",
  "Why did the computer go to the doctor? It caught a virus!",
  "Why did the cookie go to the hospital? Because he felt crummy!",
  "Why was the belt arrested? For holding up a pair of pants!",
  "Why did the chicken join a band? Because it had the drumsticks!"
  // Add more jokes up to 100+
];

function getRandomJoke() {
  return jokes[Math.floor(Math.random() * jokes.length)];
}

// ================== Q&A ==================
const qaPairs = [
  { question: "what is the capital of france?", answer: "The capital of France is Paris." },
  { question: "who is the president of the united states?", answer: "As of 2025, the president of the United States is Joe Biden." },
  { question: "what is the largest planet?", answer: "The largest planet in our solar system is Jupiter." },
  { question: "who wrote hamlet?", answer: "William Shakespeare wrote Hamlet." },
  { question: "what is the boiling point of water?", answer: "The boiling point of water is 100°C or 212°F at sea level." },
  { question: "what is the smallest prime number?", answer: "The smallest prime number is 2." },
  { question: "what is the fastest land animal?", answer: "The fastest land animal is the cheetah." },
  { question: "who painted the mona lisa?", answer: "Leonardo da Vinci painted the Mona Lisa." },
  { question: "what is the currency of japan?", answer: "The currency of Japan is the Japanese Yen." },
  { question: "what is the tallest mountain?", answer: "The tallest mountain is Mount Everest." }
  // Add more Q&A up to 100+
];

function getQAAnswer(userText) {
  const lowerText = userText.toLowerCase();
  for (let i = 0; i < qaPairs.length; i++) {
    if (lowerText.includes(qaPairs[i].question)) {
      return qaPairs[i].answer;
    }
  }
  return null;
}

// ================== AI RESPONSE ==================
function getAIResponse(userText) {
  const text = userText.toLowerCase();

  if (text.includes("hello") || text.includes("hi")) {
    return "Hello! I’m JAVIS.AI. How can I assist you today?";
  } else if (text.includes("your name")) {
    return "My name is JAVIS.AI, your personal virtual assistant.";
  } else if (text.includes("who created you")) {
    return "I was created by " + AI_CREATOR + ".";
  } else if (text.includes("time")) {
    return "Current time: " + new Date().toLocaleTimeString();
  } else if (text.includes("date")) {
    return "Today's date: " + new Date().toLocaleDateString();
  } else if (text.includes("bye")) {
    return "Goodbye! Have a wonderful day!";
  } else if (text.includes("send me riddle") || text.includes("give me a riddle")) {
    return getRandomRiddle();
  } else if (text.includes("tell me a joke") || text.includes("give me a joke")) {
    return getRandomJoke();
  } else if (text.includes("send me story") || text.includes("write story")) {
    return "Here are some story names you can choose:\n" + Object.keys(stories).join(", ");
  } else if (stories[userText]) {
    return stories[userText];
  } else {
    const answer = getQAAnswer(userText);
    if (answer) return answer;
    return "I'm still learning. Could you please rephrase that?";
  }
}

// ================== CHAT FUNCTION ==================
function sendMessage() {
  const input = document.getElementById("user-input");
  const chatBox = document.getElementById("chat-box");
  const userText = input.value.trim();
  if (userText === "") return;

  chatBox.innerHTML += `<div class="user"><b>You:</b> ${userText}</div>`;
  const aiResponse = getAIResponse(userText);
  chatBox.innerHTML += `<div class="ai"><b>${AI_NAME}:</b> ${aiResponse}</div>`;
  chatBox.scrollTop = chatBox.scrollHeight;
  input.value = "";
}
</script>

</body>
</html>
